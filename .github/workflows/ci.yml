name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Verify dependencies and run tests
        run: |
          go mod verify
          make check
      - name: Build and verify the Linux binary
        run: |
          make release
          sha256sum -c bin/social-mcp.sha256
      - name: Test HTTPS and delivery recovery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends caddy
          python3 tests/smoke.py
